# main 에 프로그램(src) 변경을 올리면 updater.py 의 APP_VERSION 으로 빌드해 GitHub 릴리스에 올린다.
# 설치된 프로그램은 켤 때 최신 릴리스를 보고, 새 버전이면 업데이트할지 묻는다.
name: release

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'requirements.txt', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          $m = Select-String -Path src/updater.py -Pattern "^APP_VERSION = '(\d+\.\d+\.\d+)'$"
          if (-not $m) { throw "updater.py 에서 APP_VERSION 을 찾지 못했습니다." }
          $ver = $m.Matches[0].Groups[1].Value
          if (git ls-remote --tags origin "refs/tags/v$ver") { throw "v$ver 은 이미 배포됐습니다. APP_VERSION 을 올려 주세요." }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and build exe
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pip install -r requirements.txt
          python tests/test_assign_rules.py
          python tests/test_homonym.py
          python tests/test_release.py
          cd src
          pyinstaller 학급편성.spec

      - name: Build installer
        working-directory: src
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: src/Output/ClassPlacementSetup.exe
          fail_on_unmatched_files: true
