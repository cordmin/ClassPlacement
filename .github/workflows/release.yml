# 소스 push는 배포하지 않는다. 승인된 배포만 Actions에서 수동 실행한다.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          $m = Select-String -Path src/updater.py -Pattern "^APP_VERSION = '(\d+\.\d+\.\d+)'$"
          if (-not $m) { throw "updater.py 에서 APP_VERSION 을 찾지 못했습니다." }
          $ver = $m.Matches[0].Groups[1].Value
          if (git ls-remote --tags origin "refs/tags/v$ver") { throw "v$ver 은 이미 배포됐습니다. APP_VERSION 을 올려 주세요." }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pip install -r requirements.txt
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Test and build installer
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Python python -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          git archive --format=zip --prefix="ClassPlacement-$env:VERSION/" -o "release/ClassPlacement-$env:VERSION-source.zip" HEAD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            release/ClassPlacementSetup.exe
            release/ClassPlacement-${{ env.VERSION }}-source.zip
          fail_on_unmatched_files: true
